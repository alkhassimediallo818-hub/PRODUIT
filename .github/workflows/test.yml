name: Test Gestion Produits

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Voir la structure du projet
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f

      - name: Vérifier les fichiers principaux
        run: |
          test -f index.html
          test -f main.js
          test -f firebase.js
          test -f style.css
          echo "Structure principale OK"

      - name: Vérifier les fichiers JavaScript
        run: |
          node --check main.js
          node --check firebase.js
          node --check JS/produits.js
          node --check JS/ventes.js
          node --check JS/historique.js
          node --check JS/dashboard.js
          node --check JS/profil.js
          node --check JS/utils.js
          echo "JavaScript OK"
