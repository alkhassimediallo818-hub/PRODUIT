name: Test Gestion Produits

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Voir la structure du projet
        run: |
          ls -la

      - name: Vérifier les fichiers importants
        run: |
          test -f ./index.html
          test -f ./main.js
          test -f ./firebase.js
          test -f ./produits.js
          test -f ./ventes.js
          echo "Structure OK"
