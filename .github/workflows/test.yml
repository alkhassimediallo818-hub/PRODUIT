name: Test Gestion Produits

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier la structure du projet
        run: |
          test -f index.html
          test -f main.js
          test -f firebase.js
          test -f produits.js
          test -f ventes.js
          echo "Structure OK"

      - name: Vérifier les fichiers JavaScript
        run: |
          node --check main.js
          node --check produits.js
          node --check ventes.js
          node --check historique.js
          node --check dashboard.js
          echo "JavaScript OK"
